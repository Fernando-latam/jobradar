name: JobRadar
on:
  schedule:
    - cron: '0 9 * * 1-5'
  workflow_dispatch:
concurrency:
  group: jobradar
  cancel-in-progress: true
permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Restaurar histórico de vagas
        uses: actions/cache@v4
        with:
          path: seen_jobs.json
          key: jobradar-history-${{ github.run_id }}
          restore-keys: |
            jobradar-history-

      - name: Rodar o JobRadar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YAHOO_EMAIL: ${{ secrets.YAHOO_EMAIL }}
          YAHOO_APP_PASSWORD: ${{ secrets.YAHOO_APP_PASSWORD }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python run.py
        continue-on-error: true

      - name: Guardar o relatório como artifact
        uses: actions/upload-artifact@v4
        with:
          name: jobradar-report
          path: output/
          retention-days: 30

       - name: Publicar no GitHub Pages
         uses: peaceiris/actions-gh-pages@v4
         with:
         github_token: ${{ secrets.GITHUB_TOKEN }}
         publish_dir: ./output
         keep_files: false
